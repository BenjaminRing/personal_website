<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- EDIT: page title shown in the browser tab and search results -->
  <title>Benjamin Ring</title>
  <!-- EDIT: one-line description used by search engines and link previews -->
  <meta name="description" content="The personal website of Benjamin Ring." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #FAF9F7;
      --text: #191A1D;
      --muted: #6B6C70;
      --accent: #B8873F;
      --accent-soft: rgba(184, 135, 63, 0.14);
      --line: rgba(25, 26, 29, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141519;
        --text: #ECEDEF;
        --muted: #9A9CA2;
        --accent: #D2A056;
        --accent-soft: rgba(210, 160, 86, 0.16);
        --line: rgba(236, 237, 239, 0.12);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    /* Signature: a thin ring that nods to the name "Ring" */
    .ring {
      position: absolute;
      top: -120px;
      right: -60px;
      width: 320px;
      height: 320px;
      color: var(--accent);
      opacity: 0.5;
      pointer-events: none;
      animation: spin 64s linear infinite;
      z-index: 0;
    }

    .ring circle { fill: none; stroke: currentColor; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .content { position: relative; z-index: 1; }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    .name {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.75rem, 9vw, 4.75rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .intro {
      font-size: clamp(1.05rem, 2.5vw, 1.2rem);
      color: var(--muted);
      max-width: 42ch;
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.75rem;
      align-items: center;
    }

    .links a {
      position: relative;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      padding: 0.2rem 0;
    }

    .links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 1.5px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.28s ease;
    }

    .links a:hover::after,
    .links a:focus-visible::after { transform: scaleX(1); }

    .links a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Quiet entrance, skipped for anyone who prefers reduced motion */
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translateY(12px);
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .reveal:nth-child(1) { animation-delay: 0.05s; }
      .reveal:nth-child(2) { animation-delay: 0.15s; }
      .reveal:nth-child(3) { animation-delay: 0.25s; }
      .reveal:nth-child(4) { animation-delay: 0.35s; }
      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <!-- Decorative ring motif -->
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="48" stroke-width="0.5" />
      <circle cx="50" cy="50" r="38" stroke-width="0.5" stroke-dasharray="120 60" />
    </svg>

    <div class="content">
      <!-- EDIT: small label above your name -->
      <p class="eyebrow reveal">Personal&nbsp;site</p>

      <!-- EDIT: your name -->
      <h1 class="name reveal">Benjamin&nbsp;Ring</h1>

      <!-- EDIT: a sentence or two about you -->
      <p class="intro reveal">Hi, I&rsquo;m Benjamin. This is my corner of the web &mdash; a work in progress while I figure out what to put here.</p>

      <!-- EDIT: replace the href values with your real links, or remove ones you don't need -->
      <nav class="links reveal">
        <a href="mailto:hello@benjaminring.de">Email</a>
        <a href="https://github.com/BenjaminRing" target="_blank" rel="noopener">GitHub</a>
        <a href="#" target="_blank" rel="noopener">LinkedIn</a>
      </nav>

      <footer>
        <!-- EDIT or remove -->
        &copy; <span id="year"></span> Benjamin Ring &middot; benjaminring.de
      </footer>
    </div>
  </main>

  <script>
    // Keeps the footer year current with no maintenance
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
