<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benjamin Ring</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="The personal website of Benjamin Ring." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:  #E8CE7A;
      --ivory: #F4F1EA;
      --muted: rgba(244, 241, 234, 0.62);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #14160f;
      color: var(--ivory);
      cursor: none;
    }

    /* Photo + fluid smear are both drawn inside this canvas */
    #bg { position: fixed; inset: 0; z-index: 0; }

    .stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      pointer-events: none;
    }

    /* ── Glass card ── */
    .card {
      position: relative;
      max-width: 620px;
      width: 100%;
      padding: 3.6rem 4rem 3.9rem;
      text-align: center;
      background: rgba(18, 22, 16, 0.26);
      backdrop-filter: blur(40px) saturate(1.5) brightness(1.04);
      -webkit-backdrop-filter: blur(40px) saturate(1.5) brightness(1.04);
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 40px 110px rgba(0, 0, 0, 0.5),
        inset 0  1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0,   0,   0, 0.22);
      opacity: 0;
      transform: translateY(24px);
      animation: emerge 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    .eyebrow {
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.4rem;
      padding-left: 0.4em;
      opacity: 0;
      animation: fade-in 0.9s ease 0.7s forwards;
    }

    .name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(3.4rem, 9vw, 6.4rem);
      /* room for the descenders on j / g */
      line-height: 1.04;
      padding-bottom: 0.12em;
      letter-spacing: 0.005em;
      color: var(--ivory);
      text-shadow: 0 2px 40px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .name .last { font-style: italic; font-weight: 400; }

    .rule {
      width: 56px; height: 1px;
      background: var(--gold);
      margin: 1.9rem auto 2.1rem;
      transform: scaleX(0);
      animation: grow 1s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }

    /* ── Links (clearly highlighted pills) ── */
    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      pointer-events: auto;
      opacity: 0;
      animation: fade-in 0.9s ease 1.2s forwards;
    }
    .links a {
      display: inline-block;
      padding: 0.7rem 1.6rem;
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ivory);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition:
        background   0.32s ease,
        color        0.32s ease,
        border-color 0.32s ease,
        transform    0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .links a:hover {
      background: var(--gold);
      color: #1b1c14;
      border-color: var(--gold);
      transform: translateY(-3px);
    }
    .links a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

    /* ── Cursor ── */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 13px; height: 13px;
      border: 1.5px solid var(--ivory);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, background 0.3s ease;
      mix-blend-mode: difference;
    }
    .cursor.big { width: 44px; height: 44px; background: rgba(232, 206, 122, 0.18); }

    @keyframes emerge  { to { opacity: 1; transform: translateY(0); } }
    @keyframes rise    { to { opacity: 1; transform: translateY(0); } }
    @keyframes grow    { to { transform: scaleX(1); } }
    @keyframes fade-in { to { opacity: 1; } }

    @media (max-width: 600px) {
      .card { padding: 2.6rem 2rem 2.9rem; border-radius: 22px; }
      html, body { cursor: auto; }
      .cursor { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .eyebrow, .name, .links { animation: none !important; opacity: 1 !important; transform: none !important; }
      .rule { animation: none !important; transform: scaleX(1) !important; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>
  <div class="cursor" id="cursor"></div>

  <div class="stage">
    <main class="card">
      <p class="eyebrow">Personal Webpage</p>
      <h1 class="name">Benjamin<br><span class="last">Ring</span></h1>
      <div class="rule"></div>
      <nav class="links" aria-label="Links">
        <a href="mailto:contact@benjaminring.de">Email</a>
        <a href="https://github.com/BenjaminRing" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/b-ring/" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </main>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── Renderer (opaque — photo + smear composited in-shader) ──────────────
    const canvas = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const DPR = Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(DPR);
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;  // raw passthrough
    renderer.setClearColor(0x14160f, 1);
    renderer.autoClear = false;

    const quadCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadGeo   = new THREE.PlaneGeometry(2, 2);
    const quad      = new THREE.Mesh(quadGeo);
    const quadScene = new THREE.Scene();
    quadScene.add(quad);
    function blit(target, material){
      quad.material = material;
      renderer.setRenderTarget(target);
      renderer.render(quadScene, quadCam);
    }

    /* ═══════════════════════════════════════════════════════════════════════
       GPU FLUID SOLVER — the velocity field liquid-distorts the photo.
       ═══════════════════════════════════════════════════════════════════════ */
    const SIM = {
      RESOLUTION: 200, VEL_DISSIPATION: 0.18,
      PRESSURE: 0.8, PRESSURE_ITER: 20, CURL: 22,
      SPLAT_RADIUS: 0.0032, SPLAT_FORCE: 7600,
    };

    function getRes(res){
      let aspect = innerWidth / innerHeight;
      if (aspect < 1) aspect = 1 / aspect;
      const min = Math.round(res);
      const max = Math.round(res * aspect);
      return innerWidth > innerHeight ? { w: max, h: min } : { w: min, h: max };
    }
    const rtOpts = {
      type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
      depthBuffer: false, stencilBuffer: false,
    };
    const makeRT = (w, h) => new THREE.WebGLRenderTarget(w, h, rtOpts);
    function makeDouble(w, h){
      return { read: makeRT(w, h), write: makeRT(w, h),
        swap(){ const t = this.read; this.read = this.write; this.write = t; },
        setSize(w, h){ this.read.setSize(w, h); this.write.setSize(w, h); } };
    }
    let res = getRes(SIM.RESOLUTION);
    let velocity = makeDouble(res.w, res.h);
    let pressure = makeDouble(res.w, res.h);
    let divergence = makeRT(res.w, res.h);
    let curl       = makeRT(res.w, res.h);
    const texel = { value: new THREE.Vector2(1 / res.w, 1 / res.h) };

    const baseVert = /* glsl */`
      varying vec2 vUv, vL, vR, vT, vB;
      uniform vec2 texelSize;
      void main(){
        vUv = uv;
        vL = uv - vec2(texelSize.x, 0.0); vR = uv + vec2(texelSize.x, 0.0);
        vT = uv + vec2(0.0, texelSize.y); vB = uv - vec2(0.0, texelSize.y);
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;
    const fluidMat = (frag, uniforms) => new THREE.ShaderMaterial({
      vertexShader: baseVert, fragmentShader: frag,
      uniforms: Object.assign({ texelSize: texel }, uniforms),
      depthTest: false, depthWrite: false,
    });

    const advectMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv;
      uniform sampler2D uVelocity, uSource; uniform float dt, dissipation; uniform vec2 texelSize;
      void main(){
        vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
        gl_FragColor = texture2D(uSource, coord) / (1.0 + dissipation * dt);
      }
    `, { uVelocity: { value: null }, uSource: { value: null }, dt: { value: 0 }, dissipation: { value: 0 } });

    const splatMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv;
      uniform sampler2D uTarget; uniform float aspectRatio, radius; uniform vec3 color; uniform vec2 point;
      void main(){
        vec2 p = vUv - point; p.x *= aspectRatio;
        vec3 splat = exp(-dot(p, p) / radius) * color;
        gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + splat, 1.0);
      }
    `, { uTarget: { value: null }, aspectRatio: { value: 1 }, radius: { value: SIM.SPLAT_RADIUS },
         color: { value: new THREE.Vector3() }, point: { value: new THREE.Vector2() } });

    const divergenceMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv, vL, vR, vT, vB; uniform sampler2D uVelocity;
      void main(){
        float L=texture2D(uVelocity,vL).x, R=texture2D(uVelocity,vR).x;
        float T=texture2D(uVelocity,vT).y, B=texture2D(uVelocity,vB).y;
        vec2 C=texture2D(uVelocity,vUv).xy;
        if(vL.x<0.0)L=-C.x; if(vR.x>1.0)R=-C.x; if(vT.y>1.0)T=-C.y; if(vB.y<0.0)B=-C.y;
        gl_FragColor=vec4(0.5*(R-L+T-B),0.0,0.0,1.0);
      }
    `, { uVelocity: { value: null } });

    const curlMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv, vL, vR, vT, vB; uniform sampler2D uVelocity;
      void main(){
        float L=texture2D(uVelocity,vL).y, R=texture2D(uVelocity,vR).y;
        float T=texture2D(uVelocity,vT).x, B=texture2D(uVelocity,vB).x;
        gl_FragColor=vec4(0.5*(R-L-T+B),0.0,0.0,1.0);
      }
    `, { uVelocity: { value: null } });

    const vorticityMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv, vL, vR, vT, vB;
      uniform sampler2D uVelocity, uCurl; uniform float curlAmount, dt;
      void main(){
        float L=texture2D(uCurl,vL).x, R=texture2D(uCurl,vR).x;
        float T=texture2D(uCurl,vT).x, B=texture2D(uCurl,vB).x, C=texture2D(uCurl,vUv).x;
        vec2 force=0.5*vec2(abs(T)-abs(B),abs(R)-abs(L));
        force/=length(force)+0.0001; force*=curlAmount*C; force.y*=-1.0;
        vec2 vel=texture2D(uVelocity,vUv).xy; vel+=force*dt; vel=clamp(vel,-1000.0,1000.0);
        gl_FragColor=vec4(vel,0.0,1.0);
      }
    `, { uVelocity: { value: null }, uCurl: { value: null }, curlAmount: { value: SIM.CURL }, dt: { value: 0 } });

    const pressureMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv, vL, vR, vT, vB; uniform sampler2D uPressure, uDivergence;
      void main(){
        float L=texture2D(uPressure,vL).x, R=texture2D(uPressure,vR).x;
        float T=texture2D(uPressure,vT).x, B=texture2D(uPressure,vB).x;
        float div=texture2D(uDivergence,vUv).x;
        gl_FragColor=vec4((L+R+T+B-div)*0.25,0.0,0.0,1.0);
      }
    `, { uPressure: { value: null }, uDivergence: { value: null } });

    const gradientMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv, vL, vR, vT, vB; uniform sampler2D uPressure, uVelocity;
      void main(){
        float L=texture2D(uPressure,vL).x, R=texture2D(uPressure,vR).x;
        float T=texture2D(uPressure,vT).x, B=texture2D(uPressure,vB).x;
        vec2 vel=texture2D(uVelocity,vUv).xy; vel-=vec2(R-L,T-B);
        gl_FragColor=vec4(vel,0.0,1.0);
      }
    `, { uPressure: { value: null }, uVelocity: { value: null } });

    const clearMat = fluidMat(/* glsl */`
      precision highp float; varying vec2 vUv; uniform sampler2D uTexture; uniform float value;
      void main(){ gl_FragColor = value * texture2D(uTexture, vUv); }
    `, { uTexture: { value: null }, value: { value: SIM.PRESSURE } });

    /* ── Composite: nature photo, liquid-distorted by the velocity field ── */
    const placeholder = new THREE.DataTexture(new Uint8Array([20, 22, 15, 255]), 1, 1);
    placeholder.needsUpdate = true;

    const displayMat = fluidMat(/* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTexA, uTexB, uVelocity;
      uniform float uFade, uAspA, uAspB, uScreenAsp, uDisplace, uTime;
      uniform vec2 uParallax, texelSize;

      // background-size: cover mapping
      vec2 coverUv(vec2 uv, float imgAsp){
        vec2 c = uv;
        if (uScreenAsp > imgAsp) c.y = (uv.y - 0.5) * (imgAsp / uScreenAsp) + 0.5;
        else                     c.x = (uv.x - 0.5) * (uScreenAsp / imgAsp) + 0.5;
        return c;
      }
      void main(){
        // Liquid displacement from the fluid velocity field
        vec2 vel = texture2D(uVelocity, vUv).xy;
        vec2 disp = vel * texelSize * uDisplace;

        // slight zoom leaves room for parallax; parallax follows the cursor
        vec2 uv = (vUv - 0.5) / 1.06 + 0.5 + uParallax + disp;

        vec3 a = texture2D(uTexA, coverUv(uv, uAspA)).rgb;
        vec3 b = texture2D(uTexB, coverUv(uv, uAspB)).rgb;
        vec3 col = mix(a, b, uFade);
        col *= 0.82;                                   // gentle darken for contrast

        // Vignette toward the edges keeps the card legible
        float vig = smoothstep(0.95, 0.32, distance(vUv, vec2(0.5)));
        col *= mix(0.5, 1.0, vig);

        gl_FragColor = vec4(col, 1.0);
      }
    `, {
      uTexA: { value: placeholder }, uTexB: { value: placeholder },
      uVelocity: { value: null },
      uFade: { value: 0 }, uAspA: { value: 1.5 }, uAspB: { value: 1.5 },
      uScreenAsp: { value: innerWidth / innerHeight },
      uDisplace: { value: 0.06 }, uTime: { value: 0 },
      uParallax: { value: new THREE.Vector2() },
    });

    function clearFluid(){
      renderer.setClearColor(0x000000, 0);
      for (const rt of [velocity.read, velocity.write,
                        pressure.read, pressure.write, divergence, curl]) {
        renderer.setRenderTarget(rt); renderer.clear(true, false, false);
      }
      renderer.setRenderTarget(null);
      renderer.setClearColor(0x14160f, 1);
    }
    clearFluid();

    function splat(px, py, dx, dy){
      const aspect = innerWidth / innerHeight;
      splatMat.uniforms.aspectRatio.value = aspect;
      splatMat.uniforms.point.value.set(px, py);
      splatMat.uniforms.radius.value = SIM.SPLAT_RADIUS * (aspect > 1 ? aspect : 1);
      splatMat.uniforms.uTarget.value = velocity.read.texture;
      splatMat.uniforms.color.value.set(dx, dy, 0);
      blit(velocity.write, splatMat); velocity.swap();
    }

    /* ── Nature slideshow textures ── */
    const SLIDES = [
      'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=2400&q=85', // mountain
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=85', // beach
      'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2400&q=85', // forest
      'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=2400&q=85', // lake
    ];
    const textures = []; const aspects = [];
    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');
    let loaded = 0, cur = 0, nxt = 0, transitioning = false, fade = 0;
    SLIDES.forEach((url, i) => {
      loader.load(url, (tex) => {
        tex.colorSpace = THREE.NoColorSpace;
        tex.minFilter = THREE.LinearFilter;
        tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
        textures[i] = tex;
        aspects[i] = tex.image.width / tex.image.height;
        loaded++;
        if (i === 0) {
          displayMat.uniforms.uTexA.value = tex;
          displayMat.uniforms.uAspA.value = aspects[i];
        }
      });
    });
    // advance every 7.5s
    setInterval(() => {
      if (transitioning || loaded < SLIDES.length) return;
      nxt = (cur + 1) % SLIDES.length;
      displayMat.uniforms.uTexB.value = textures[nxt];
      displayMat.uniforms.uAspB.value = aspects[nxt];
      transitioning = true;
    }, 7500);

    /* ── Input ── */
    const pointer = { x: 0.5, y: 0.5, dx: 0, dy: 0, moved: false };
    let lastX = 0.5, lastY = 0.5;
    const parTarget = new THREE.Vector2();
    function onMove(px, py){
      const x = px / innerWidth, y = 1.0 - py / innerHeight;
      pointer.dx = x - lastX; pointer.dy = y - lastY;
      pointer.x = x; pointer.y = y; pointer.moved = true;
      lastX = x; lastY = y; tcx = px; tcy = py;
      parTarget.set((px / innerWidth - 0.5) * -0.02, (py / innerHeight - 0.5) * 0.02);
    }
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

    const cursorEl = document.getElementById('cursor');
    let cx = innerWidth / 2, cy = innerHeight / 2, tcx = cx, tcy = cy;
    document.querySelectorAll('a').forEach(a => {
      a.addEventListener('mouseenter', () => cursorEl.classList.add('big'));
      a.addEventListener('mouseleave', () => cursorEl.classList.remove('big'));
    });

    window.addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      displayMat.uniforms.uScreenAsp.value = innerWidth / innerHeight;
      res = getRes(SIM.RESOLUTION);
      texel.value.set(1 / res.w, 1 / res.h);
      velocity.setSize(res.w, res.h); pressure.setSize(res.w, res.h);
      divergence.setSize(res.w, res.h); curl.setSize(res.w, res.h);
      clearFluid();
    });

    /* ── Fluid step ── */
    function step(dt){
      curlMat.uniforms.uVelocity.value = velocity.read.texture; blit(curl, curlMat);
      vorticityMat.uniforms.uVelocity.value = velocity.read.texture;
      vorticityMat.uniforms.uCurl.value = curl.texture; vorticityMat.uniforms.dt.value = dt;
      blit(velocity.write, vorticityMat); velocity.swap();
      divergenceMat.uniforms.uVelocity.value = velocity.read.texture; blit(divergence, divergenceMat);
      clearMat.uniforms.uTexture.value = pressure.read.texture; clearMat.uniforms.value.value = SIM.PRESSURE;
      blit(pressure.write, clearMat); pressure.swap();
      pressureMat.uniforms.uDivergence.value = divergence.texture;
      for (let i = 0; i < SIM.PRESSURE_ITER; i++) {
        pressureMat.uniforms.uPressure.value = pressure.read.texture;
        blit(pressure.write, pressureMat); pressure.swap();
      }
      gradientMat.uniforms.uPressure.value = pressure.read.texture;
      gradientMat.uniforms.uVelocity.value = velocity.read.texture;
      blit(velocity.write, gradientMat); velocity.swap();
      advectMat.uniforms.uVelocity.value = velocity.read.texture;
      advectMat.uniforms.uSource.value   = velocity.read.texture;
      advectMat.uniforms.dt.value = dt; advectMat.uniforms.dissipation.value = SIM.VEL_DISSIPATION;
      blit(velocity.write, advectMat); velocity.swap();
    }

    const par = new THREE.Vector2();
    let lastTime = performance.now();
    const clock = new THREE.Clock();
    function frame(){
      requestAnimationFrame(frame);
      const now = performance.now();
      let dt = (now - lastTime) / 1000; lastTime = now; dt = Math.min(dt, 0.0166);

      // slideshow crossfade
      if (transitioning) {
        fade += dt / 2.0;
        if (fade >= 1.0) {
          fade = 0; cur = nxt; transitioning = false;
          displayMat.uniforms.uTexA.value = textures[cur];
          displayMat.uniforms.uAspA.value = aspects[cur];
        }
        displayMat.uniforms.uFade.value = fade;
      }

      if (pointer.moved) {
        pointer.moved = false;
        splat(pointer.x, pointer.y, pointer.dx * SIM.SPLAT_FORCE, pointer.dy * SIM.SPLAT_FORCE);
      }
      step(dt);

      par.lerp(parTarget, 0.05);
      displayMat.uniforms.uParallax.value.copy(par);
      displayMat.uniforms.uVelocity.value = velocity.read.texture;
      displayMat.uniforms.uTime.value = clock.getElapsedTime();

      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      quad.material = displayMat;
      renderer.render(quadScene, quadCam);

      cx += (tcx - cx) * 0.18; cy += (tcy - cy) * 0.18;
      cursorEl.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    }
    frame();
  </script>
</body>
</html>
