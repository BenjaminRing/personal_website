<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benjamin Ring</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="The personal website of Benjamin Ring." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0c1a0e;
      color: #fff;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 2.25rem 3rem;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      pointer-events: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      opacity: 0;
      animation: fade-in 0.8s ease 0.2s forwards;
    }

    .monogram {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.4);
    }

    .nav {
      display: flex;
      gap: 0.4rem;
      pointer-events: auto;
    }

    .nav a {
      display: inline-block;
      padding: 0.48rem 1.2rem;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition:
        color        0.3s ease,
        background   0.3s ease,
        border-color 0.3s ease,
        transform    0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.30);
      transform: translateY(-2px);
    }

    .nav a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.45);
      outline-offset: 3px;
    }

    /* ── Hero name ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 0.25rem;
    }

    .name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      /* Edge-to-edge sizing like Buttermax */
      font-size: clamp(5rem, 15.5vw, 15rem);
      line-height: 0.87;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 2px 80px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateY(50px);
      animation: emerge 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .name .last {
      font-style: italic;
      /* Slightly reduced opacity mirrors Buttermax's "max" script contrast */
      color: rgba(255, 255, 255, 0.78);
    }

    /* ── Footer ── */
    .footer {
      padding-top: 1.5rem;
      flex-shrink: 0;
      opacity: 0;
      animation: fade-in 0.9s ease 1.6s forwards;
    }

    .eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
    }

    /* ── Cursor dot ── */
    .cursor {
      position: fixed;
      width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
      mix-blend-mode: difference;
    }

    @keyframes emerge {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }

    @media (max-width: 600px) {
      .stage { padding: 1.5rem 1.5rem; }
      .nav a { padding: 0.42rem 0.9rem; font-size: 0.67rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .name, .header, .footer { opacity: 1 !important; transform: none !important; }
      .cursor { display: none; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>
  <div class="cursor" id="cursor"></div>

  <div class="stage">
    <header class="header">
      <span class="monogram">BR</span>
      <nav class="nav" aria-label="Links">
        <a href="mailto:contact@benjaminring.de">Email</a>
        <a href="https://github.com/BenjaminRing" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/b-ring/" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </header>

    <main class="hero">
      <h1 class="name">
        Benjamin<br>
        <span class="last">Ring</span>
      </h1>
    </main>

    <footer class="footer">
      <p class="eyebrow">Personal Webpage</p>
    </footer>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── Renderer ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x0c1a0e, 1);

    // ── Scene & Camera ────────────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.z = 4.5;

    // ── Shaders ───────────────────────────────────────────────────────────
    const vert = /* glsl */`
      uniform float uTime;
      uniform vec2  uMouse;
      varying vec3  vNormal;
      varying vec3  vPos;

      // Simplex 3-D noise — Ashima Arts (MIT)
      vec3 mod289v3(vec3 x){return x-floor(x*(1./289.))*289.;}
      vec4 mod289v4(vec4 x){return x-floor(x*(1./289.))*289.;}
      vec4 permute(vec4 x){return mod289v4(((x*34.)+1.)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}

      float snoise(vec3 v){
        const vec2 C=vec2(1./6.,1./3.);
        const vec4 D=vec4(0.,.5,1.,2.);
        vec3 i =floor(v+dot(v,C.yyy));
        vec3 x0=v-i+dot(i,C.xxx);
        vec3 g =step(x0.yzx,x0.xyz);
        vec3 l =1.-g;
        vec3 i1=min(g.xyz,l.zxy);
        vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx;
        vec3 x2=x0-i2+C.yyy;
        vec3 x3=x0-D.yyy;
        i=mod289v3(i);
        vec4 p=permute(permute(permute(
          i.z+vec4(0.,i1.z,i2.z,1.))
          +i.y+vec4(0.,i1.y,i2.y,1.))
          +i.x+vec4(0.,i1.x,i2.x,1.));
        float n_=.142857142857;
        vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.*floor(p*ns.z*ns.z);
        vec4 x_=floor(j*ns.z);
        vec4 y_=floor(j-7.*x_);
        vec4 x=x_*ns.x+ns.yyyy;
        vec4 y=y_*ns.x+ns.yyyy;
        vec4 h=1.-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy);
        vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.+1.;
        vec4 s1=floor(b1)*2.+1.;
        vec4 sh=-step(h,vec4(0.));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
        vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x);
        vec3 p1=vec3(a0.zw,h.y);
        vec3 p2=vec3(a1.xy,h.z);
        vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
        vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
        m=m*m;
        return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }

      void main(){
        vNormal = normalize(normalMatrix * normal);
        float t = uTime * 0.35;

        // Three octaves of noise for an organic, living surface
        float n  = snoise(position * 1.0 + vec3(t*.65, t*.40, t*.50));
        float n2 = snoise(position * 2.1 - vec3(t*.45, t*.72, t*.30)) * 0.40;
        float n3 = snoise(position * 4.2 + vec3(t*.28, t*.55, t*.82)) * 0.15;
        float disp = (n + n2 + n3) * 0.22;

        // Mouse nudges the surface where the cursor points
        float md = dot(normalize(position.xy), uMouse);
        disp += smoothstep(0.2, 1.0, md) * 0.14;

        vPos = position + normal * disp;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(vPos, 1.0);
      }
    `;

    const frag = /* glsl */`
      uniform float uTime;
      uniform vec2  uMouse;
      varying vec3  vNormal;
      varying vec3  vPos;

      void main(){
        vec3 n = normalize(vNormal);

        // Fresnel edge glow
        vec3 view = normalize(cameraPosition - vPos);
        float fr = pow(1.0 - clamp(dot(n, view), 0.0, 1.0), 3.0);

        // Palette — forest dark to vivid green, with blue edge and gold accent
        vec3 dark   = vec3(0.030, 0.090, 0.040);
        vec3 midG   = vec3(0.070, 0.320, 0.140);
        vec3 brightG= vec3(0.200, 0.820, 0.470);
        vec3 blue   = vec3(0.180, 0.620, 0.960);
        vec3 gold   = vec3(0.960, 0.750, 0.210);

        // Normal-driven lighting
        float nUp = dot(n, normalize(vec3(0.3, 1.0, 0.6))) * 0.5 + 0.5;
        vec3 col  = mix(dark, midG, nUp * 0.55);
        col = mix(col, brightG, pow(nUp, 2.8) * 0.40);

        // Mouse-directed gold shimmer
        float mg = dot(normalize(vPos.xy), uMouse);
        col = mix(col, gold, smoothstep(0.5, 1.0, mg) * 0.30);

        // Animated surface banding
        float band = sin(vPos.y * 7.0 + uTime * 1.3) * 0.5 + 0.5;
        col += brightG * band * 0.042;

        // Fresnel → blue edge glow
        col = mix(col, blue, fr * 0.72);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // ── Organic blob ──────────────────────────────────────────────────────
    const geo = new THREE.SphereGeometry(1.65, 128, 128);
    const uniforms = {
      uTime:  { value: 0 },
      uMouse: { value: new THREE.Vector2() },
    };
    const mat  = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms });
    const blob = new THREE.Mesh(geo, mat);
    scene.add(blob);

    // ── Floating particles ────────────────────────────────────────────────
    const N = 900;
    const pts = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pts[i*3]   = (Math.random() - 0.5) * 14;
      pts[i*3+1] = (Math.random() - 0.5) * 9;
      pts[i*3+2] = (Math.random() - 0.5) * 6 - 2;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0x34d382, size: 0.013, transparent: true, opacity: 0.25, sizeAttenuation: true,
    });
    scene.add(new THREE.Points(pGeo, pMat));

    // ── Mouse & touch tracking ────────────────────────────────────────────
    const tgt = new THREE.Vector2();
    const cur = new THREE.Vector2();

    const onMove = (x, y) => {
      tgt.x =  (x / innerWidth  - 0.5) * 2;
      tgt.y = -(y / innerHeight - 0.5) * 2;
    };
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // ── Blob position: right-of-center on wide, centred on mobile ────────
    const setPosition = () => {
      blob.position.x = innerWidth > 700 ? 0.85 : 0;
      blob.position.y = innerWidth > 700 ? -0.15 : -0.5;
    };
    setPosition();

    // ── Resize ────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      setPosition();
    });

    // ── Cursor dot ───────────────────────────────────────────────────────
    const cursorEl = document.getElementById('cursor');
    let cx = innerWidth / 2, cy = innerHeight / 2;
    let tcx = cx, tcy = cy;
    window.addEventListener('mousemove', e => { tcx = e.clientX; tcy = e.clientY; });
    document.querySelectorAll('a').forEach(a => {
      a.addEventListener('mouseenter', () => cursorEl.style.transform = 'translate(-50%,-50%) scale(2.5)');
      a.addEventListener('mouseleave', () => cursorEl.style.transform = 'translate(-50%,-50%) scale(1)');
    });

    // ── Render loop ───────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    (function loop() {
      requestAnimationFrame(loop);
      const t = clock.getElapsedTime();

      // Smooth mouse lerp
      cur.x += (tgt.x - cur.x) * 0.045;
      cur.y += (tgt.y - cur.y) * 0.045;

      uniforms.uTime.value = t;
      uniforms.uMouse.value.copy(cur);

      // Gentle rotation + mouse tilt
      blob.rotation.y = t * 0.07 + cur.x * 0.42;
      blob.rotation.x = cur.y * 0.28;

      // Smooth cursor
      cx += (tcx - cx) * 0.12;
      cy += (tcy - cy) * 0.12;
      cursorEl.style.left = cx + 'px';
      cursorEl.style.top  = cy + 'px';

      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
